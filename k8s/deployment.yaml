apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-2048
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: game-2048
  template:
    metadata:
      labels:
        app: game-2048
    spec:
      containers:
        - name: game-2048
          image: 111200748241.dkr.ecr.ca-central-1.amazonaws.com/2048-game:latest
          ports:
            - containerPort: 80
